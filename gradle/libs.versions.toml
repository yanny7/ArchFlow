[versions]
gson = "2.15.0"
intellijPlatform = "2.20.1"
javaparser = "3.28.2"
jgit = "7.8.1.202611041320-r"
junit = "6.1.3"
slf4j = "2.0.18"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
