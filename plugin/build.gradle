plugins {
    alias(libs.plugins.intellijPlatform)
}

def sinceBuild = '263'
def repository = rootProject.layout.projectDirectory.dir('repository')

repositories {
    intellijPlatform {
        defaultRepositories()
    }
}

configurations.runtimeClasspath {
    exclude group: 'org.slf4j'
}

dependencies {
    implementation project(':core')
    implementation project(':viewer')

    intellijPlatform {
        intellijIdea '2026.3'
        bundledPlugin 'com.intellij.modules.jcef'
        bundledModule 'intellij.platform.ui.jcef'
        bundledModule 'intellij.libraries.jcef'
    }
}

intellijPlatform {
    projectName = 'archflow'
    instrumentCode = false

    pluginVerification {
        ides {
            create(org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdea, '2026.3')
        }
    }

    pluginConfiguration {
        ideaVersion {
            sinceBuild = sinceBuild
        }
    }
}

tasks.register('publishLocal', Sync) {
    group = 'distribution'
    description = 'Publishes the plugin to the local plugin repository that the IDE reads for updates.'
    def zipName = tasks.named('buildPlugin').flatMap { it.archiveFileName }
    def pluginVersion = project.version.toString()
    from tasks.named('buildPlugin')
    into repository
    doLast {
        def zip = repository.file(zipName.get()).asFile
        repository.file('updatePlugins.xml').asFile.text = """<plugins>
  <plugin id="com.yanny.archflow" url="${zip.toPath().toUri()}" version="${pluginVersion}">
    <idea-version since-build="${sinceBuild}"/>
  </plugin>
</plugins>
"""
    }
}
